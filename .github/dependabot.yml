# Dependabot proposes dependency updates as pull requests, once a week.
# Minor and patch updates are grouped into one pull request per ecosystem;
# a major version comes on its own, since it may need changes.
version: 2
updates:
  # No pip: a node takes cryptography, dkimpy and pyspf from its distribution,
  # so requirements.txt states minimums for development rather than pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github_actions_minor_and_patch:
        update-types: ["minor", "patch"]
