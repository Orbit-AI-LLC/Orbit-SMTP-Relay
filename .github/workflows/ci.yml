name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the optional encryption dependency
        run: python -m pip install --upgrade pip cryptography
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n install.sh deploy/entrypoint.sh deploy/orbit-relay-receive
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t orbit-relay:ci .
      - name: Smoke test the CLI inside the image
        run: |
          docker run --rm -e ORBIT_MAIL_SERVER_URL=https://mail.example.com orbit-relay:ci check
          docker run --rm orbit-relay:ci key generate | grep -q '^orbe_'
