; Runs Postfix and the relay agent inside one container.
;
; Both are supervised so that a crash in either is restarted without the whole
; node going down. The agent is deliberately marked `autorestart=true` and
; without a restart limit: it should come back from any failure, because its
; queue is durable and a stopped agent means mail accumulating undelivered.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/lib/orbit-mail/state/run/supervisord.pid

[program:postfix]
command=/usr/bin/postfix start-fg
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:relay-agent]
command=/opt/orbit-relay/bin/orbit-relay run --status-port 8080
environment=ORBIT_POSTFIX_DIR="/etc/postfix/orbit"
priority=20
autorestart=true
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
