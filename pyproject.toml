[project]
name = "orbit-relay"
version = "3.0.0"
description = "Relay agent that runs SMTP for Orbit Mail: inbound mail to the server, outbound mail from it."
requires-python = ">=3.11"
# AES-256-GCM for sealing mail on the node. In the image it comes from the
# distribution (python3-cryptography); elsewhere pip installs it.
dependencies = ["cryptography>=41"]

[project.scripts]
orbit-relay = "relay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay"]
