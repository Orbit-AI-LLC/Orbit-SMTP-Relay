[project]
name = "orbit-relay"
version = "2.1.0"
description = "Relay agent that runs SMTP for Orbit Mail: inbound mail to the server, outbound mail from it."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only needed when the node encrypts mail (ORBIT_RELAY_ENCRYPTION_KEY_FILE).
encryption = ["cryptography>=41"]

[project.scripts]
orbit-relay = "relay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay"]
